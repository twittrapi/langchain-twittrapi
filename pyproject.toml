[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-twittrapi"
version = "0.1.0"
description = "LangChain tools for TwittrAPI: read X (Twitter) users, tweets, search, lists, communities and trends from your agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
authors = [{ name = "TwittrAPI" }]
keywords = ["langchain", "twitter", "x", "tools", "agents", "twittrapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "twittrapi>=0.2.0,<0.3",
]

[project.urls]
Homepage = "https://twittrapi.com"
Documentation = "https://twittrapi.com/docs"
Source = "https://github.com/twittrapi/langchain-twittrapi"
Issues = "https://github.com/twittrapi/langchain-twittrapi/issues"
Changelog = "https://github.com/twittrapi/langchain-twittrapi/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.24,<2",
    "langchain-tests>=1.0.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_twittrapi"]

[tool.hatch.build.targets.sdist]
include = ["langchain_twittrapi", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
